name: Build and publish radar viewer

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]
  # Best effort: GitHub schedules can be delayed; this is not a live API.
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt -r requirements-publish.txt pytest
      - name: Validate browser JavaScript
        run: |
          node --check docs/assets/radar-utils.js
          node --check docs/assets/radar-directory.js
          node --check docs/assets/places-core.js
          node --check docs/assets/places.js
          node --check docs/assets/advisory-core.js
          node --check docs/assets/advisory.js
          node --check docs/assets/selected-map.js
          node --check docs/assets/app.js
          node --check docs/assets/near-me.js
          node --check docs/assets/forecast-core.js
          node --check docs/assets/forecast.js
          node --check docs/assets/weather-intel-core.js
          node --check docs/assets/weather-intel.js
          node --check docs/assets/animation.js
          node --check docs/assets/pwa.js
          node --check docs/assets/easy-refresh.js
          node --check docs/assets/public-overview.js
          node --check docs/assets/home.js
          node --check docs/assets/place-name-core.js
          node --check docs/assets/place-name.js
          node --check docs/assets/rain-outlook-core.js
          node --check docs/assets/rain-outlook.js
          node --check docs/sw.js
          node --test tests/test_near_me.cjs
          node --test tests/test_forecast.cjs
          node --test tests/test_weather_intel.cjs
          node --test tests/test_one_tap.cjs
          node --test tests/test_easy_refresh.cjs
          node --test tests/test_public_overview.cjs
          node --test tests/test_home.cjs
          node --test tests/test_place_name.cjs
          node --test tests/test_rain_outlook.cjs
          node --test tests/test_rain_outlook_ui.cjs
          node --test tests/test_radar_directory.cjs
          node --test tests/test_region_zoom.cjs
          node --test tests/test_pwa_install.cjs
          node --test tests/test_places_history.cjs
          node --test tests/test_advisory.cjs
      - name: Run backend and snapshot tests
        run: python -m pytest -q tests/test_app.py tests/test_publish.py tests/test_history.py tests/test_public_overview.py

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install snapshot dependencies
        run: python -m pip install -r requirements-publish.txt
      - name: Read public TMD pages (best effort, never fake radar data)
        run: |
          python scripts/build_icons.py
          python scripts/build_public_overview.py --output docs/data
          python scripts/update_radar.py --output docs/data --previous-site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
